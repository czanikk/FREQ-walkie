<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FREQ — System Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════
       SWISS INTERNATIONAL STYLE (ADMIN)
       ══════════════════════════════════════════════════ */
    :root {
      --bg: #FFFFFF;
      --fg: #000000;
      --muted: #F2F2F2;
      --accent: #FF3000;
      --border-width: 4px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .swiss-grid-pattern {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
    }

    h1, h2, h3, th {
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    
    .header-block {
      background: var(--fg);
      color: var(--bg);
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title-massive {
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      border-bottom: var(--border-width) solid var(--fg);
    }
    .stat-card {
      padding: 32px;
      border-right: var(--border-width) solid var(--fg);
      background: var(--muted);
    }
    .stat-card:last-child { border-right: none; }
    .stat-label {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
    }

    .main-content {
      padding: 48px;
      flex: 1;
    }
    .section-title {
      font-size: 2rem;
      margin-bottom: 24px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .section-number { color: var(--accent); }

    /* TABLES */
    table {
      width: 100%;
      border-collapse: collapse;
      border: var(--border-width) solid var(--fg);
    }
    th, td {
      border: 2px solid var(--fg);
      padding: 16px;
      text-align: left;
    }
    th {
      background: var(--muted);
      font-size: 1.1rem;
    }
    td {
      font-size: 1.1rem;
      font-weight: 500;
    }

    button {
      background: var(--fg);
      color: var(--bg);
      border: none;
      padding: 12px 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 0.9rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0s, transform 0.1s ease-out;
    }
    button:hover { background: var(--accent); }
    button:active { transform: scale(0.98); }
    
    button.danger {
      background: var(--bg);
      color: var(--fg);
      border: 2px solid var(--fg);
    }
    button.danger:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
  </style>
</head>
<body class="swiss-grid-pattern">

  <div class="header-block">
    <h1 class="title-massive">FREQ / SYSTEM ADMIN</h1>
    <button id="refreshBtn" style="background: var(--bg); color: var(--fg);">REFRESH DATA</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">ACTIVE FREQUENCIES</div>
      <div class="stat-value" id="statChannels">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">TOTAL CONNECTIONS</div>
      <div class="stat-value" id="statConnections">0</div>
    </div>
  </div>

  <div class="main-content">
    <h2 class="section-title"><span class="section-number">01.</span> ACTIVE FREQUENCIES</h2>
    
    <table id="channelsTable">
      <thead>
        <tr>
          <th>FREQUENCY</th>
          <th>PEERS</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" style="text-align:center; color:#666;">LOADING...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const el = id => document.getElementById(id);
    
    async function loadData() {
      try {
        const res = await fetch('/api/admin/status');
        if (!res.ok) throw new Error('Failed to fetch status');
        const data = await res.json();
        
        el('statChannels').textContent = data.activeChannels;
        el('statConnections').textContent = data.totalConnections;
        
        renderTable(data.channels);
      } catch(e) {
        alert('Error loading data: ' + e.message);
      }
    }

    function renderTable(channelsObj) {
      const tbody = el('channelsTable').querySelector('tbody');
      tbody.innerHTML = '';
      
      const freqs = Object.keys(channelsObj);
      if (freqs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; font-weight:700;">NO ACTIVE FREQUENCIES</td></tr>';
        return;
      }

      freqs.forEach(freq => {
        const ch = channelsObj[freq];
        const tr = document.createElement('tr');
        
        let peersHtml = ch.peers.map(p => {
          const name = p.split('___')[0];
          return `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid #ccc;">
            <span>${name}</span>
            <button class="danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="kickPeer('${freq}', '${p}')">KICK</button>
          </div>`;
        }).join('');
        if (!peersHtml) peersHtml = '<em>Empty</em>';

        tr.innerHTML = `
          <td style="vertical-align: top; font-weight:900; font-size: 1.5rem;">${freq}</td>
          <td style="vertical-align: top;">${peersHtml}</td>
          <td style="vertical-align: top; width: 200px;">
            <button class="danger" style="width: 100%; margin-bottom: 8px;" onclick="closeRoom('${freq}')">CLOSE ROOM</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function kickPeer(freq, peerId) {
      if (!confirm(`Are you sure you want to kick ${peerId.split('___')[0]} from ${freq}?`)) return;
      try {
        const res = await fetch('/api/admin/kick', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ freq, peerId })
        });
        const data = await res.json();
        if (data.success) {
          loadData();
        } else {
          alert('Error: ' + data.message);
        }
      } catch(e) {
        alert('Request failed');
      }
    }

    async function closeRoom(freq) {
      if (!confirm(`Are you sure you want to completely close ${freq}? All users will be disconnected.`)) return;
      try {
        const res = await fetch('/api/admin/close-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ freq })
        });
        const data = await res.json();
        if (data.success) {
          loadData();
        } else {
          alert('Error: ' + data.message);
        }
      } catch(e) {
        alert('Request failed');
      }
    }

    el('refreshBtn').addEventListener('click', loadData);
    
    // Auto refresh every 10 seconds
    setInterval(loadData, 10000);
    
    // Initial load
    window.onload = loadData;
  </script>
</body>
</html>
